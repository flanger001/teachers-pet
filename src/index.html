<!DOCTYPE html>
<html lang="en">
<head>
	<base href="/teachers-pet/">
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Student Activity Log</title>
	<link rel="stylesheet" href="style.css">
	<link rel="favicon" href="favicon.ico">
	<script src="app.js" defer></script>
</head>
<body>
	<header>
		<h1 class="text-center">Student Activity Log</h1>
	</header>
	<main>
		<!-- Admin controls -->
		<div id="admin-controls">
			<h2>Admin controls</h2>
			<form class="form" id="add-student">
				<div class="form-control">
					<label class="label" for="student-name" placeholder="Student name (required)">Student name</label>
					<input class="input-text" type="text" name="student-name" required />
				</div>
				<div class="form-control">
					<label class="label" for="student-color">Color</label>
					<input class="input-color" type="color" name="student-color" value="#e0e0ff" />
				</div>
				<div class="form-control">
					<input class="input-submit button" type="submit" id="add-student" value="Add student">
				</div>
			</form>
			<div class="form-control">
				<button class="button" id="clear-student-store">Clear student records</button>
				<button class="button" id="clear-activities">Clear activity records</button>
				<button class="button" id="delete-database">Delete all data (will reload page)</button>
				<button class="button" id="toggle-results" data-toggle="closed">Show Activities</button>
				<button class="button" id="export-results">Export Activities</button>
			</div>
		</div>

		<!-- Students container -->
		<div id="students">
			<h2>Students list</h2>
		</div>

		<!-- Results container -->
		<div id="results"></div>

		<!-- Student activity form template -->
		<template id="student">
			<div class="student" id="{name}">
				<h2 class="student-header" id="{name}-header"></h2>
				<div class="student-activities"></div>
				<form class="form" id="{buttonId}">
					<div class="form-control">
						<label class="label" for="activity">New activity name</label>
						<input class="input-text" type="text" name="activity-name" required />
					</div>
					<div class="form-control">
						<input class="input-submit button" type="submit" value="{Button 1}" />
					</div>
				</form>
				<div class="form-control delete-student">
					<button class="button">Delete Student</button>
				</div>
			</div>
		</template>

		<!-- Activity entry template -->
		<template id="activity">
			<div class="activity-button">
				<button class="button" id="{activity-name}"></button>
			</div>
		</template>

		<!-- Activity table template -->
		<template id="activities">
			<table>
				<thead>
					<tr>
						<th>Student name</th>
						<th>Activity</th>
						<th>Timestamp</th>
					</tr>
				</thead>
				<tbody class="records"></tbody>
			</table>
		</template>

		<!-- Activity record template -->
		<template id="record">
			<tr class="row">
				<td class="name"></td>
				<td class="activity"></td>
				<td class="timestamp"></td>
			</tr>
		</template>
	</main>
	<footer></footer>
</body>
</html>
