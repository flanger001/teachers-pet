<!DOCTYPE html>
<html lang="en">
<head>
	<base href="/teachers-pet/">
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Student Activity Log</title>
	<link rel="stylesheet" href="style.css">
	<link rel="favicon" href="favicon.ico">
	<script src="app.js" defer></script>
</head>
<body>
	<header>
		<h1 class="text-center">Student Activity Log</h1>
	</header>
	<main>
		<!-- Admin controls -->
		<div class="admin-controls" id="admin-controls">
			<h2 class="admin-controls__header">Admin controls</h2>
			<form class="form" id="add-student">
				<div class="form-control">
					<label class="label" for="student-name" placeholder="Student name (required)">Student name</label>
					<input class="input-text" type="text" name="student-name" required />
				</div>
				<div class="form-control">
					<label class="label" for="student-color">Color</label>
					<input class="input-color" type="color" name="student-color" value="#e0e0ff" />
				</div>
				<div class="form-control">
					<input class="input-submit button" type="submit" id="add-student" value="Add student">
				</div>
			</form>
			<div class="form-control">
				<!-- <button class="button" id="clear-student-store">Clear student records</button>
				<button class="button" id="clear-activity-store">Clear activity records</button> -->
				<button class="button" id="delete-database">Delete all data (will reload page)</button>
				<button class="button" id="toggle-results" data-toggle="closed">Show Activities</button>
				<button class="button" id="export-results">Export Activities</button>
			</div>
		</div>

		<!-- Students container -->
		<div class="students-container" id="students-container">
			<h2 class="students-container__header">Students list</h2>
			<div class="students" id="students"></div>
		</div>

		<!-- Results container -->
		<div id="results"></div>

		<!-- Student activity form template -->
		<template id="student">
			<div class="student">
				<div class="student-header">
					<h2 class="student-name"></h2>
					<button class="delete-student button" title="Delete Student">×</button>
				</div>
				<form class="form student-activity-form">
					<div class="form-control">
						<label class="label" for="activity">New activity name</label>
						<input class="input-text" type="text" name="activity-name" required />
					</div>
					<div class="form-control">
						<input class="input-submit button" type="submit" />
					</div>
				</form>
				<div class="student-activities">
					<h3>Tracked activities</h3>
				</div>
			</div>
		</template>

		<!-- Activity entry template -->
		<template id="activity">
			<div class="activity-buttons">
				<p class="activity-name"></p>
				<button class="button record-occurrence-button">Record occurence</button>
				<button class="button remove-occurrence-button">Remove occurences</button>
				<button class="button untrack-activity-button">Stop tracking</button>
			</div>
		</template>

		<!-- Activity table template -->
		<template id="activities">
			<table class="activities-table">
				<thead>
					<tr class="header-row">
						<th>Student name</th>
						<th>Activity</th>
						<th>Timestamp</th>
					</tr>
				</thead>
				<tbody class="records"></tbody>
			</table>
		</template>

		<!-- Activity record template -->
		<template id="record">
			<tr class="activity-row">
				<td class="name"></td>
				<td class="activity"></td>
				<td class="timestamp"></td>
			</tr>
		</template>
	</main>
	<footer></footer>
</body>
</html>
